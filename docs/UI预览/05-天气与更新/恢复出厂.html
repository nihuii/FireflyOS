<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FireflyOS 恢复出厂预览</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Microsoft YaHei", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111820; }
    main { display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; padding: 32px; }
    .watch { width: 410px; height: 502px; box-sizing: border-box; border-radius: 84px; overflow: hidden;
      background: radial-gradient(circle at 50% 0, #173036, #05090c 52%); border: 1px solid #31545a;
      padding: 50px 38px 40px; display: flex; flex-direction: column; align-items: stretch; }
    h1 { margin: 0; text-align: center; font-size: 25px; color: #effffb; }
    .eyebrow { margin: 20px 0 8px; color: #65e8c8; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    p { color: #a7bbc0; line-height: 1.5; font-size: 15px; margin: 0 0 14px; }
    .keep { padding: 12px 14px; border-radius: 16px; color: #c8fff3; background: #0d2727; border: 1px solid #2c7168; }
    .spacer { flex: 1; }
    button { width: 100%; min-height: 52px; border: 0; border-radius: 18px; margin-top: 10px;
      font-size: 16px; font-weight: 650; color: #06110f; background: #68e6c6; }
    button.secondary { color: #f6c8c8; background: #32191c; border: 1px solid #8c3f46; }
    button.ghost { color: #bdd0d4; background: #18242a; }
    .danger { color: #ff8b91; }
  </style>
</head>
<body>
<main>
  <section class="watch" aria-label="恢复出厂第一确认">
    <h1>Factory Reset</h1>
    <div class="eyebrow">First confirmation</div>
    <p>Erase pairing, Wi-Fi, notifications, weather, settings and internal caches.</p>
    <p class="keep">Keep SD media</p>
    <div class="spacer"></div>
    <button>Reset, keep SD</button>
    <button class="secondary">Delete managed FireflyOS data</button>
    <button class="ghost">Cancel</button>
  </section>
  <section class="watch" aria-label="SD 数据第二确认">
    <h1>Erase SD data?</h1>
    <div class="eyebrow danger">Second confirmation</div>
    <p>This removes only the managed folders under <strong>/FireflyOS</strong>. Other SD content is not touched.</p>
    <p class="keep">This action cannot be undone.</p>
    <div class="spacer"></div>
    <button class="secondary">Confirm SD erase</button>
    <button class="ghost">Go back</button>
  </section>
</main>
</body>
</html>
